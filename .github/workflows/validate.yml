name: XenForo Add-on Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax
        run: find upload/src/addons/Warext/HataBildirimi -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON syntax and version
        run: |
          php -r '$d=json_decode(file_get_contents("upload/src/addons/Warext/HataBildirimi/addon.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["version_id"] ?? 0) !== 1010020 || ($d["version_string"] ?? "") !== "1.1.2") { fwrite(STDERR, "Beklenen surum 1.1.2 degil.\n"); exit(1); }'
      - name: XML and XenForo data constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          data = Path('upload/src/addons/Warext/HataBildirimi/_data')
          files = list(data.rglob('*.xml'))
          for file in files:
              ET.parse(file)

          if (data / 'admin_templates').exists():
              raise SystemExit('Admin template dosyalari ayri admin_templates klasorunde tutulamaz; templates.xml icinde type=admin olmali.')

          option_groups = ET.parse(data / 'option_groups.xml').getroot()
          groups = {g.attrib.get('group_id'): g for g in option_groups.findall('group')}
          if 'wrxtHataSettings' not in groups:
              raise SystemExit('wrxtHataSettings option group XenForo 2.3 <group> formatiyla tanimli degil.')
          if option_groups.findall('option_group'):
              raise SystemExit('option_groups.xml icinde gecersiz <option_group> etiketi kullanilamaz; XenForo <group> bekler.')

          cron = ET.parse(data / 'cron.xml').getroot()
          for entry in cron.findall('entry'):
              entry_id = entry.attrib.get('entry_id', '')
              if len(entry_id) > 25:
                  raise SystemExit(f'Cron entry_id 25 karakteri asiyor: {entry_id} ({len(entry_id)})')

          templates = ET.parse(data / 'templates.xml').getroot()
          admin_titles = {t.attrib.get('title') for t in templates.findall('template') if t.attrib.get('type') == 'admin'}
          required_admin = {'wrxt_hata_admin_list', 'wrxt_hata_admin_view', 'wrxt_hata_admin_analytics', 'wrxt_hata_admin.less'}
          missing_admin = required_admin - admin_titles
          if missing_admin:
              raise SystemExit('Eksik admin template: ' + ', '.join(sorted(missing_admin)))

          for template in templates.findall('template'):
              body = template.text or ''
              title = template.attrib.get('title', '')
              if 'responsive-data-list' in body:
                  raise SystemExit(f'Yanlis responsive datalist init: {title}')
              if re.search(r'\{\$[^{}\n]*\?:[^{}\n]*\}', body):
                  raise SystemExit(f'XenForo degisken etiketi icinde gecersiz kisa ternary: {title}')
              for main in re.findall(r'<xf:main\b[^>]*>(.*?)</xf:main>', body, flags=re.S):
                  stripped = main.strip()
                  if stripped and not re.match(r'<xf:(label|hint|explain)\b', stripped):
                      raise SystemExit(f'xf:main beklenmeyen dogrudan child iceriyor: {title}')

          mods = (data / 'template_modifications.xml').read_text(encoding='utf-8')
          if 'icon="fa-bug"' not in mods or 'u-srOnly">Hata Bildir</span>' not in mods:
              raise SystemExit('Hata Bildir ikon butonu template modification icinde bulunamadi.')
          if '<span>Hata Bildir</span>' in mods:
              raise SystemExit('Hata Bildir butonunda gorunur metin bulunuyor; yalnizca ikon olmali.')

          required_mods = (
              'wrxt_hata_prepared_reply_manager',
              'wrxt_hata_prepared_reply_mode_close',
              'wrxt-hata-hazir-cevaplar/category-add',
              'prepared_reply_category_id',
              '<xf:editorrow name="message"',
              "bb_code($item.message, 'wrxt_bug_report'",
              '$log.Actor.username',
              'contentRow-extra',
              'wrxt_hata_alert_staff_action_text',
              "extra.event == 'assignee'",
              "extra.event == 'resolution'",
              'wrxt_hata_report_list_new_flag',
              'wrxt_hata_report_list_category',
              'wrxt_hata_report_list_status',
              'js-wrxtPreparedReplyComposer',
              'js-wrxtPreparedReplySelect',
              'warext/hata-bildirimi/prepared-replies.js',
              'wrxtHata-preparedReplyPicker'
          )
          for required in required_mods:
              if required not in mods:
                  raise SystemExit('1.1.2 template baglantisi eksik: ' + required)

          for forbidden in ('data-wrxt-prepared-reply-form="1"', 'form.submit()'):
              if forbidden in mods:
                  raise SystemExit('Hazir cevap secimi sayfa yenilememeli; eski yapi bulundu: ' + forbidden)

          navigation = ET.parse(data / 'admin_navigation.xml').getroot()
          entries = {e.attrib.get('navigation_id'): e for e in navigation.findall('admin_navigation_entry')}
          root = entries.get('wrxtHataSystem')
          if root is None or root.attrib.get('parent_navigation_id'):
              raise SystemExit('Hata Bildirim Sistemi ACP icinde bagimsiz ust seviye bolum olmali.')
          for child in ('wrxtHataReports', 'wrxtHataPreparedReplies', 'wrxtHataAnalytics', 'wrxtHataSettings'):
              if child not in entries or entries[child].attrib.get('parent_navigation_id') != 'wrxtHataSystem':
                  raise SystemExit(f'ACP alt navigasyonu eksik veya yanlis: {child}')
          if entries['wrxtHataSettings'].attrib.get('link', '').rstrip('/') != 'options/groups/wrxtHataSettings':
              raise SystemExit('Ayarlar navigasyonu wrxtHataSettings option group rotasina gitmeli.')

          routes = ET.parse(data / 'routes.xml').getroot()
          route_prefixes = {r.attrib.get('route_prefix') for r in routes.findall('route')}
          if 'wrxt-hata-hazir-cevaplar' not in route_prefixes:
              raise SystemExit('Hazir cevap ACP rotasi eksik.')

          options = ET.parse(data / 'options.xml').getroot()
          option_ids = {o.attrib.get('option_id') for o in options.findall('option')}
          required_options = {
              'wrxtHataAutoInvestigatingOnAssign',
              'wrxtHataNotifyStatus',
              'wrxtHataNotifyStaffReply'
          }
          missing_options = required_options - option_ids
          if missing_options:
              raise SystemExit('Eksik hata bildirim ayari: ' + ', '.join(sorted(missing_options)))

          print(f'{len(files)} XML dosyasi ve XenForo veri/template sinirlari dogrulandi.')
          PY
      - name: Controller relation sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          controllers = Path('upload/src/addons/Warext/HataBildirimi').rglob('Controller/*.php')
          for file in controllers:
              body = file.read_text(encoding='utf-8')
              for relation in ('Attachments', 'Messages'):
                  patterns = [
                      rf'->with\([^;]{{0,500}}{relation}',
                      rf'->find\([^;]{{0,500}}{relation}',
                      rf'assertOwnedReport\([^;]{{0,200}}{relation}'
                  ]
                  if any(re.search(pattern, body, flags=re.S) for pattern in patterns):
                      raise SystemExit(f'TO_MANY relation eager-load/join kullanimi bulundu: {file} -> {relation}')
          print('Controller TO_MANY relation kontrolleri basarili.')
          PY
      - name: Default permission sanity
        run: |
          grep -q "applyMissingGroupPermissions(2, \['submit', 'viewOwn', 'attach'\])" upload/src/addons/Warext/HataBildirimi/Setup.php
          grep -q "applyMissingGroupPermissions(3, \['submit', 'viewOwn', 'attach', 'manage'\])" upload/src/addons/Warext/HataBildirimi/Setup.php
          grep -q "wrxtHataManage" upload/src/addons/Warext/HataBildirimi/Setup.php
      - name: Workflow notification sanity
        run: |
          MANAGER='upload/src/addons/Warext/HataBildirimi/Service/ReportManager.php'
          grep -q 'wrxtHataAutoInvestigatingOnAssign' "$MANAGER"
          grep -q "changeStatus(\$actor, \$report, 'investigating')" "$MANAGER"
          grep -q 'wrxtHataNotifyStatus' "$MANAGER"
          grep -q 'wrxtHataNotifyStaffReply' "$MANAGER"
          grep -q "'event' => 'assignee'" "$MANAGER"
          grep -q "'event' => 'resolution'" "$MANAGER"
          grep -q "'dependsOnAddOnId' => 'Warext/HataBildirimi'" "$MANAGER"
          if grep -Eq 'owner->user_id[^\n]*actor->user_id' "$MANAGER"; then
            echo 'Rapor sahibi ile yetkili ayni hesap oldugunda bildirim engellenmemeli.'
            exit 1
          fi
          grep -q "link('hata-bildirimlerim/view'" upload/src/addons/Warext/HataBildirimi/_data/templates.xml
      - name: Prepared reply sanity
        run: |
          test -s upload/src/addons/Warext/HataBildirimi/Entity/PreparedReply.php
          test -s upload/src/addons/Warext/HataBildirimi/Entity/PreparedReplyCategory.php
          test -s upload/src/addons/Warext/HataBildirimi/Admin/Controller/PreparedReply.php
          test -s upload/src/addons/Warext/HataBildirimi/PreparedReplySetupTrait.php
          test -s upload/js/warext/hata-bildirimi/prepared-replies.js
          grep -q 'use PreparedReplySetupTrait' upload/src/addons/Warext/HataBildirimi/Setup.php
          grep -q 'createPreparedReplyCategoryTable' upload/src/addons/Warext/HataBildirimi/PreparedReplySetupTrait.php
          grep -q 'upgrade1010000Step2' upload/src/addons/Warext/HataBildirimi/PreparedReplySetupTrait.php
          grep -q "plugin('XF:Editor')->fromInput('message')" upload/src/addons/Warext/HataBildirimi/Admin/Controller/PreparedReply.php
          grep -q "plugin('XF:Editor')->fromInput('message')" upload/src/addons/Warext/HataBildirimi/Admin/Controller/Report.php
          grep -q "plugin('XF:Editor')->fromInput('message')" upload/src/addons/Warext/HataBildirimi/Pub/Controller/Mine.php
          grep -q "PreparedReplyCategory'" upload/src/addons/Warext/HataBildirimi/Admin/Controller/Report.php
          grep -q "with('Actor')" upload/src/addons/Warext/HataBildirimi/Admin/Controller/Report.php
          grep -q "'Actor'" upload/src/addons/Warext/HataBildirimi/Entity/ReportLog.php
          grep -q "getHandler(textarea, 'editor')" upload/js/warext/hata-bildirimi/prepared-replies.js
          grep -q 'replaceContent(html, bbCode)' upload/js/warext/hata-bildirimi/prepared-replies.js
      - name: Admin layout sanity
        run: |
          grep -q 'wrxtHata-techGrid' upload/src/addons/Warext/HataBildirimi/_data/templates.xml
          grep -q 'wrxtHata-tableScroll' upload/src/addons/Warext/HataBildirimi/_data/templates.xml
          grep -q 'wrxtHata-code' upload/src/addons/Warext/HataBildirimi/_data/templates.xml
      - name: JavaScript syntax
        run: |
          node --check upload/js/warext/hata-bildirimi/diagnostics.js
          node --check upload/js/warext/hata-bildirimi/prepared-replies.js
      - name: Validate XenForo archive layout
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.2.zip'
          rm -rf .release .ci-dist
          mkdir -p .release .ci-dist
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../.ci-dist/$PACKAGE" upload README.md
          )
          test -s ".ci-dist/$PACKAGE"
          test "$(unzip -Z1 ".ci-dist/$PACKAGE" | grep -c '^upload/src/addons/.*/addon.json$')" -eq 1
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/HataBildirimi/addon.json'
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/HataBildirimi/Entity/PreparedReply.php'
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/HataBildirimi/Entity/PreparedReplyCategory.php'
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/HataBildirimi/PreparedReplySetupTrait.php'
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/js/warext/hata-bildirimi/diagnostics.js'
          unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/js/warext/hata-bildirimi/prepared-replies.js'
          if unzip -Z1 ".ci-dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/HataBildirimi/hashes.json'; then
            exit 1
          fi
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: xenforo-addon-1.1.2
          path: .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.2.zip
          if-no-files-found: error
      - name: Sync validated package to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.2.zip'
          cp ".ci-dist/$PACKAGE" "$PACKAGE"
          if git diff --quiet -- "$PACKAGE"; then
            echo 'Repository package is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE"
          git commit -m '1.1.2'
          git push
