name: XenForo Add-on Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax
        run: find upload/src/addons/Warext/HataBildirimi -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON syntax
        run: php -r 'json_decode(file_get_contents("upload/src/addons/Warext/HataBildirimi/addon.json"), true, 512, JSON_THROW_ON_ERROR);'
      - name: XML and XenForo data constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          data = Path('upload/src/addons/Warext/HataBildirimi/_data')
          files = list(data.rglob('*.xml'))
          for file in files:
              ET.parse(file)

          cron = ET.parse(data / 'cron.xml').getroot()
          for entry in cron.findall('entry'):
              entry_id = entry.attrib.get('entry_id', '')
              if len(entry_id) > 25:
                  raise SystemExit(f'Cron entry_id 25 karakteri asiyor: {entry_id} ({len(entry_id)})')

          templates = ET.parse(data / 'templates.xml').getroot()
          for template in templates.findall('template'):
              body = template.text or ''
              title = template.attrib.get('title', '')
              if 'responsive-data-list' in body:
                  raise SystemExit(f'Yanlis responsive datalist init: {title}')
              for main in re.findall(r'<xf:main\b[^>]*>(.*?)</xf:main>', body, flags=re.S):
                  stripped = main.strip()
                  if stripped and not re.match(r'<xf:(label|hint|explain)\b', stripped):
                      raise SystemExit(f'xf:main beklenmeyen dogrudan child iceriyor: {title}')

          print(f'{len(files)} XML dosyası ve XenForo veri/template sınırları doğrulandı.')
          PY
      - name: Default permission sanity
        run: |
          grep -q "applyMissingGroupPermissions(2, \['submit', 'viewOwn', 'attach'\])" upload/src/addons/Warext/HataBildirimi/Setup.php
          grep -q "applyMissingGroupPermissions(3, \['submit', 'viewOwn', 'attach', 'manage'\])" upload/src/addons/Warext/HataBildirimi/Setup.php
          grep -q "wrxtHataManage" upload/src/addons/Warext/HataBildirimi/Setup.php
      - name: JavaScript syntax
        run: node --check upload/js/warext/hata-bildirimi/diagnostics.js
      - name: Validate XenForo archive layout
        run: |
          rm -rf .release .ci-dist
          mkdir -p .release .ci-dist
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r ../.ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip upload README.md
          )
          test -s .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip
          test "$(unzip -Z1 .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip | grep -c '^upload/src/addons/.*/addon.json$')" -eq 1
          unzip -Z1 .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip | grep -qx 'upload/src/addons/Warext/HataBildirimi/addon.json'
          unzip -Z1 .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip | grep -qx 'upload/js/warext/hata-bildirimi/diagnostics.js'
          if unzip -Z1 .ci-dist/Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.3.zip | grep -qx 'upload/src/addons/Warext/HataBildirimi/hashes.json'; then
            exit 1
          fi
