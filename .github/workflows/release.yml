name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.0.9 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.9.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.0.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.0.9'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.9.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.0.9' \
              --notes '1.0.9; ACP içinde bağımsız Hata Bildirim Sistemi bölümü, Hata Bildirimleri / İstatistikler / Ayarlar navigasyonu, ilk personel atamasında isteğe bağlı otomatik İnceleniyor akışı ve kullanıcı durum/yetkili cevap bildirimleri için yönetim ayarlarını içerir.'
          fi
