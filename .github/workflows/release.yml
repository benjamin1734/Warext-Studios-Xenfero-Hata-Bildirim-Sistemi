name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.2 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.2.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.2'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.2.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.2' \
              --notes '1.1.2; XenForo 2.3 option group veri biçimini düzelterek Ayarlar sayfasındaki 404 sorununu giderir. Hata listesine Yeni etiketi ile Türkçe kategori/durum etiketleri ekler. Hazır cevap seçicisini kullanıcı cevap formunun altına taşır ve şablonları sayfa yenilemeden doğrudan WYSIWYG/BBCode editörüne aktarır.'
          fi
