name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.0 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.0.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.0'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.0.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.0' \
              --notes '1.1.0; XenForo editor girdisinin doğru işlenmesiyle hazır cevap kayıt hatasını giderir. Hazır cevap kategorileri, kategori ve cevap sıralaması, kategorisiz cevap desteği, kategori bazlı seçim listesi ve kategori yönetim arayüzü ekler.'
          fi
