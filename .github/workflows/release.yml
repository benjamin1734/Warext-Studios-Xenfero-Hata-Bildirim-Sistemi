name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.4 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.4.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (cd .release && zip -q -r "../$PACKAGE" upload README.md)
          test -s "$PACKAGE"

      - name: Publish 1.1.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.4'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.4.zip'
          echo 'MS4xLjQ7IEFDUCBB ' | tr -d ' ' | base64 --decode > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.4' --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.4' --notes-file /tmp/release-notes.md
          fi
