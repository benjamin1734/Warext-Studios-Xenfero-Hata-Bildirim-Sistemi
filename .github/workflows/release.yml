name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.0.10 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.10.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.0.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.0.10'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.0.10.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.0.10' \
              --notes '1.0.10; özelleştirilebilir BBCode destekli hazır cevap sistemi, XenForo varsayılan editörüyle cevap oluşturma, rapor ekranında hazır cevabı editöre yükleme ve yönetim ekranlarında yetkili ID yerine kullanıcı adı gösterimini içerir.'
          fi
