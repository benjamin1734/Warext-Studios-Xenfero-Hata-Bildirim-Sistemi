name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.4 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.4.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.1.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.4'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.4.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.4' \
              --notes '1.1.4; ACP Ayarlar sayfasındaki ham option anahtarlarını düzelterek XenForo 2.3 phrase adlandırmasını option.*, option_explain.*, option_group.* ve option_group_description.* biçimine geçirir. Hata Bildir butonu için sağ/sol alt, sağ/sol üst, sağ/sol orta ve footer sol/orta/sağ olmak üzere dokuz konum seçeneği ekler.'
          fi
