name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.1 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.1.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (
            cd .release
            zip -q -r "../$PACKAGE" upload README.md
          )
          test -s "$PACKAGE"

      - name: Publish 1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.1'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.1.zip'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.1' \
              --notes '1.1.1; hazır cevap kategori ekranında tema uyumlu Düzenle/Sil butonları ve daha belirgin kategori-cevap ayrımı ekler. Hazır cevap seçimi artık Editöre yükle butonu gerektirmeden otomatik olarak cevap editörüne aktarılır. Yetkili cevapları ile durum, atama ve çözüm işlemlerinin XenForo bildirim akışı düzeltilmiş; rapor sahibi ile işlemi yapan yetkili aynı hesap olsa dahi bildirim oluşturulması sağlanmıştır.'
          fi
