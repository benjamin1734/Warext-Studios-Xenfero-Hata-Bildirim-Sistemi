name: Publish XenForo Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Read version
        id: meta
        run: |
          VERSION=$(php -r '$d=json_decode(file_get_contents("upload/src/addons/Warext/HataBildirimi/addon.json"), true); echo $d["version_string"];')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Validate XML, JSON and PHP
        run: |
          find upload/src/addons/Warext/HataBildirimi -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          root=Path('upload/src/addons/Warext/HataBildirimi')
          json.loads((root/'addon.json').read_text(encoding='utf-8'))
          for p in (root/'_data').glob('*.xml'): ET.parse(p)
          for p in Path('languages').glob('*.xml'): ET.parse(p)
          print('Validation OK')
          PY
      - name: Build release package
        run: |
          PACKAGE='${{ steps.meta.outputs.package }}'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md LANGUAGE.md .release/
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (cd .release && zip -qr "../$PACKAGE" upload README.md LANGUAGE.md)
          test -s "$PACKAGE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.meta.outputs.tag }}'
          VERSION='${{ steps.meta.outputs.version }}'
          PACKAGE='${{ steps.meta.outputs.package }}'
          NOTES="Turkish/English language completion, phrase-backed template modifications and dynamic release packaging."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Warext Studios XenForo Hata Bildirim Sistemi $VERSION" --notes "$NOTES"
            gh release upload "$TAG" "$PACKAGE" languages/Turkish.xml languages/English.xml --clobber
          else
            gh release create "$TAG" "$PACKAGE" languages/Turkish.xml languages/English.xml --title "Warext Studios XenForo Hata Bildirim Sistemi $VERSION" --notes "$NOTES" --latest
          fi
