name: Publish XenForo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1.1.5 release package
        run: |
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.5.zip'
          rm -rf .release
          mkdir -p .release
          cp -a upload .release/upload
          cp README.md .release/README.md
          rm -f .release/upload/src/addons/Warext/HataBildirimi/hashes.json
          (cd .release && zip -q -r "../$PACKAGE" upload README.md)
          test -s "$PACKAGE"

      - name: Publish 1.1.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.5'
          PACKAGE='Warext-Studios-Xenfero-Hata-Bildirim-Sistemi-1.1.5.zip'
          cat > /tmp/release-notes.md <<'EOF'
          1.1.5 mobil Admin CP hata raporu listesini yeniden düzenler. Masaüstündeki tablo korunurken telefon ve dar ekranlarda her rapor okunabilir bir karta dönüşür; rapor/açıklama tam genişlikte, kullanıcı-kategori, durum-tanılama ve atanan-tarih alanları düzenli şekilde gösterilir. Uzun açıklamaların sütunu birkaç karakter genişliğe sıkıştırıp sayfayı aşırı uzatması engellenir. Toplu seçim kutuları ve mevcut kategori/durum etiketleri mobil kartlarda çalışmaya devam eder.

          ---

          Version 1.1.5 redesigns the Admin CP bug-report list for mobile. The desktop table remains unchanged, while reports become readable cards on phones and narrow screens. Report text gets full width and metadata is arranged into compact pairs, preventing long descriptions from collapsing into extremely narrow columns. Bulk-selection controls and existing category/status labels remain available on mobile.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.5' --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" --title 'Warext Studios XenForo Hata Bildirim Sistemi 1.1.5' --notes-file /tmp/release-notes.md
          fi
